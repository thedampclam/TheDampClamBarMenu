<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Damp Clam — Beer & Wine</title>
  
  <!-- Website Favicon -->
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="apple-touch-icon" href="logo.jpg" />

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0d2822 0%, #03140f 100%);
      --card-bg: rgba(2, 22, 17, 0.75);
      --neon-cyan: #00f7ff;
      --neon-green: #39ff14;
      --neon-purple: #c042ff;
      --neon-pink: #ff2a8d;
      --neon-gold: #ffd700;
      --neon-red: #ff3344;
      --gold-amber: #e5b567;
      --off-white: #f8fafc;
      --border: #16382c;
      --font: "Georgia", Times, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--off-white);
      padding: 1.5rem 1rem 3rem;
      min-height: 100vh;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    nav.site-nav {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .nav-link {
      text-decoration: none;
      color: var(--gold-amber);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.5rem 1.25rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.3);
      transition: all 0.25s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 247, 255, 0.35);
      background: rgba(0, 247, 255, 0.08);
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-shadow: 0 0 5px #fff, 0 0 20px var(--neon-cyan), 0 0 35px var(--neon-purple);
    }

    .stats {
      font-size: 0.85rem;
      color: var(--gold-amber);
      background: var(--card-bg);
      padding: 0.4rem 1.15rem;
      border-radius: 20px;
      border: 1px solid var(--gold-amber);
      margin-top: 0.3rem;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .search-input {
      width: 100%;
      max-width: 420px;
      padding: 0.6rem 1.25rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--off-white);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 8px rgba(0, 247, 255, 0.3);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }

    .filter-btn {
      background: transparent;
      color: var(--gold-amber);
      border: 1px solid var(--gold-amber);
      padding: 0.45rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .filter-btn:hover { background: rgba(229, 181, 103, 0.12); }

    .filter-btn.active {
      background: rgba(0, 247, 255, 0.1);
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 5px rgba(0, 247, 255, 0.6);
    }

    .sub-filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
    }

    .sub-pill {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      color: var(--off-white);
      padding: 0.35rem 0.9rem;
      border-radius: 16px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sub-pill:hover,
    .sub-pill.active {
      background: rgba(192, 66, 255, 0.15);
      border-color: var(--neon-purple);
      color: var(--neon-purple);
      box-shadow: 0 0 6px rgba(192, 66, 255, 0.4);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .card:hover {
      border-color: rgba(0, 247, 255, 0.5);
      box-shadow: 0 0 18px rgba(0, 247, 255, 0.2);
    }

    .card.out-of-stock {
      opacity: 0.6;
      border-color: rgba(255, 51, 68, 0.35);
    }

    .card.out-of-stock:hover {
      border-color: var(--neon-red);
      box-shadow: 0 0 15px rgba(255, 51, 68, 0.25);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      gap: 0.5rem;
    }

    .card-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--neon-pink);
      font-weight: bold;
    }

    .badge-sub {
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--neon-cyan);
      background: rgba(0, 247, 255, 0.1);
      border: 1px solid rgba(0, 247, 255, 0.4);
      padding: 2px 7px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .badge-out {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(255, 51, 68, 0.25);
      border: 1px solid var(--neon-red);
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: bold;
      text-shadow: 0 0 5px var(--neon-red);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-style: italic;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .card-details {
      font-size: 0.85rem;
      line-height: 1.55;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }

    .card-details div { margin-bottom: 0.4rem; }
    .card-details strong { color: var(--gold-amber); }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      padding-top: 0.65rem;
      border-top: 1px solid rgba(22, 56, 44, 0.6);
      font-size: 0.8rem;
    }

    .stock-tag-in {
      color: var(--neon-green);
      font-weight: bold;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.3);
    }

    .stock-tag-out {
      color: var(--neon-red);
      font-weight: bold;
    }

    .size-tag {
      color: var(--gold-amber);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="site-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="spirits.html" class="nav-link">Spirits & Whiskeys</a>
      <a href="cocktails.html" class="nav-link">Cocktail Menu</a>
      <a href="beer-wine.html" class="nav-link active">Beer & Wine</a>
      <a href="merch.html" class="nav-link">Merch</a>
    </nav>

    <header>
      <h1>Beer & Wine</h1>
      <div class="stats" id="totalCount">Total Selections: <strong>0</strong></div>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by name, brewery, style..." />
      <div class="filters" id="categoryFilterContainer"></div>
      <div class="sub-filter-bar" id="subFilterContainer" style="display: none;"></div>
    </div>

    <main class="grid" id="beerWineGrid"></main>
  </div>

  <script>
    let allItems = [];
    let currentCategory = "All";
    let currentSubCategory = "All";
    let searchQuery = "";

    const categories = ["All", "Beer", "Hard Seltzer", "Wine"];

    async function init() {
      try {
        const res = await fetch("data/beer-wine.json");
        if (!res.ok) throw new Error("Could not fetch data/beer-wine.json");
        const data = await res.json();
        allItems = data.items || [];
        renderFilters();
        renderGrid();
      } catch (err) {
        console.error("Error loading beer & wine:", err);
        document.getElementById("beerWineGrid").innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: var(--neon-red);">
            Failed to load beer & wine inventory. Please verify data/beer-wine.json.
          </div>
        `;
      }

      document.getElementById("searchInput").addEventListener("input", (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        renderGrid();
      });
    }

    function renderFilters() {
      const container = document.getElementById("categoryFilterContainer");
      container.innerHTML = categories
        .map(cat => `<button class="filter-btn ${cat === currentCategory ? "active" : ""}" data-category="${cat}">${cat === "Hard Seltzer" ? "Hard Seltzers" : cat}</button>`)
        .join("");

      container.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentCategory = btn.dataset.category;
          currentSubCategory = "All";
          renderFilters();
          renderSubFilters();
          renderGrid();
        });
      });

      renderSubFilters();
    }

    function renderSubFilters() {
      const subContainer = document.getElementById("subFilterContainer");

      if (currentCategory === "All") {
        subContainer.style.display = "none";
        subContainer.innerHTML = "";
        return;
      }

      const subCategories = Array.from(
        new Set(
          allItems
            .filter(item => item.category === currentCategory && item.subCategory)
            .map(item => item.subCategory)
        )
      ).sort();

      if (subCategories.length === 0) {
        subContainer.style.display = "none";
        subContainer.innerHTML = "";
        return;
      }

      subContainer.style.display = "flex";
      subContainer.innerHTML = `
        <button class="sub-pill ${currentSubCategory === "All" ? "active" : ""}" data-sub="All">All ${currentCategory}</button>
        ${subCategories.map(sub => `
          <button class="sub-pill ${currentSubCategory === sub ? "active" : ""}" data-sub="${sub}">${sub}</button>
        `).join("")}
      `;

      subContainer.querySelectorAll(".sub-pill").forEach(pill => {
        pill.addEventListener("click", () => {
          currentSubCategory = pill.dataset.sub;
          renderSubFilters();
          renderGrid();
        });
      });
    }

    function renderGrid() {
      const grid = document.getElementById("beerWineGrid");

      const filtered = allItems.filter(item => {
        const matchesCat = currentCategory === "All" || item.category === currentCategory;
        const matchesSub = currentSubCategory === "All" || item.subCategory === currentSubCategory;

        let matchesSearch = true;
        if (searchQuery) {
          const haystack = [
            item.name,
            item.category,
            item.subCategory,
            item.style,
            item.origin,
            item.details,
            item.extra?.notes
          ].filter(Boolean).join(" ").toLowerCase();

          matchesSearch = haystack.includes(searchQuery);
        }

        return matchesCat && matchesSub && matchesSearch;
      });

      document.getElementById("totalCount").innerHTML = `Total Selections: <strong>${filtered.length}</strong>`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--gold-amber);">No items found matching your selection.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const displayDescription = item.extra?.notes || item.details || "";
        const displayStyle = item.style || item.subCategory || item.category;
        const displayAbv = item.abv && item.abv !== "N/A" ? item.abv : (item.proof || "");
        const displaySize = item.size || (item.sizes ? Object.keys(item.sizes)[0] : "");

        return `
          <div class="card ${!item.inStock ? 'out-of-stock' : ''}">
            <div>
              <div class="card-top">
                <span class="card-category">${item.category}</span>
                <div style="display: flex; gap: 6px; align-items: center;">
                  ${item.subCategory ? `<span class="badge-sub">${item.subCategory}</span>` : ''}
                  ${!item.inStock ? `<span class="badge-out">Out of Stock</span>` : ''}
                </div>
              </div>
              <div class="card-title">${item.name}</div>
              ${displayDescription ? `<div class="card-desc">${displayDescription}</div>` : ''}
            </div>

            <div class="card-details">
              <div><strong>Style:</strong> ${displayStyle}</div>
              ${item.origin ? `<div><strong>Origin:</strong> ${item.origin}</div>` : ''}
              ${displayAbv ? `<div><strong>ABV / Proof:</strong> ${displayAbv}</div>` : ''}
              ${item.extra?.barrel && item.extra.barrel !== 'N/A' ? `<div><strong>Aging:</strong> ${item.extra.barrel}</div>` : ''}

              <div class="card-footer">
                ${item.inStock 
                  ? `<span class="stock-tag-in">● In Stock ${item.quantity !== undefined ? `(${item.quantity})` : ''}</span>`
                  : `<span class="stock-tag-out">● Out of Stock</span>`
                }
                ${displaySize ? `<span class="size-tag">${displaySize}</span>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
