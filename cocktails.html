      margin-bottom: 2rem;
      padding-bottom: 1.25rem;

      text-decoration: none;
      color: var(--gold-amber);

      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.5rem 1.25rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.3);
      transition: all 0.25s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 247, 255, 0.35);
      background: rgba(0, 247, 255, 0.08);

      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-shadow: 0 0 5px #fff, 0 0 20px var(--neon-cyan), 0 0 35px var(--neon-purple);

      font-size: 0.85rem;
      color: var(--gold-amber);
      background: var(--card-bg);
      padding: 0.4rem 1.15rem;
      border-radius: 20px;
      border: 1px solid var(--gold-amber);
      margin-top: 0.3rem;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }

      background: transparent;
      color: var(--gold-amber);
      border: 1px solid var(--gold-amber);
      padding: 0.45rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .filter-btn:hover { background: rgba(229, 181, 103, 0.12); }

    .filter-btn.active {
      background: rgba(0, 247, 255, 0.1);
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 5px rgba(0, 247, 255, 0.6);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .card:hover {
      border-color: rgba(0, 247, 255, 0.5);
      box-shadow: 0 0 18px rgba(0, 247, 255, 0.2);
    }

    .card.out-of-stock {
      opacity: 0.6;
      border-color: rgba(255, 51, 68, 0.35);
    }

    .card.out-of-stock:hover {
      border-color: var(--neon-red);
      box-shadow: 0 0 15px rgba(255, 51, 68, 0.25);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .card-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--neon-pink);
      font-weight: bold;
    }

      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(255, 51, 68, 0.25);
      border: 1px solid var(--neon-red);
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: bold;
      text-shadow: 0 0 5px var(--neon-red);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.5rem;

      font-style: italic;
      margin-bottom: 1rem;
      line-height: 1.4;

      "Classics": 3,
      "Mule Collection": 4,
      "Mocktails & Zero-Proof": 5
    };

    async function loadData() {
      // Try data/cocktails.json first, then ./cocktails.json, fallback to embedded array
      const paths = ["data/cocktails.json", "cocktails.json"];
      for (const p of paths) {
        try {
          const res = await fetch(p);
          if (res.ok) {
            const data = await res.json();
            if (data && Array.isArray(data.items) && data.items.length > 0) {
              cocktails = data.items;
              break;
            }
          }
        } catch (e) {
          // continue checking
        }
      }
      renderFilters();
      renderGrid();
    }

    function renderFilters() {
      const container = document.getElementById("filterContainer");
      container.innerHTML = categoryOrder
        .map(cat => `<button class="filter-btn ${cat === currentCategory ? "active" : ""}" data-category="${cat}">${cat === "Seasonal" ? "🍂 Seasonal" : cat}</button>`)
        .join("");

      container.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentCategory = btn.dataset.category;
          renderFilters();
          renderGrid();
        });
      });
    }

    function renderGrid() {
      const grid = document.getElementById("cocktailGrid");
      let filtered = cocktails.filter(c => currentCategory === "All" || c.category === currentCategory);

      // Sort so Seasonal items stay pinned at the top
      filtered.sort((a, b) => {
        const weightA = categoryWeight[a.category] || 99;
        const weightB = categoryWeight[b.category] || 99;
        return weightA - weightB;
      });

      document.getElementById("totalCount").innerHTML = `Total Cocktails: <strong>${cocktails.length}</strong>`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--gold-amber); padding: 2rem;">No cocktails found for this section.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(c => `
        <div class="card ${!c.inStock ? 'out-of-stock' : ''}">
          <div>
            <div class="card-top">
              <span class="card-category">${c.category}</span>
              ${!c.inStock ? `<span class="badge-out">Out of Stock</span>` : ''}
            </div>
            <div class="card-title">${c.name}</div>
            <div class="card-desc">${c.desc || ''}</div>
          </div>
          ${(c.recipe || c.ingredients || c.glass || c.garnish || c.missingReason) ? `
          <div class="card-details">
            ${c.recipe ? `
            <div class="recipe-box">
              <strong>Spec / Recipe:</strong>
              ${c.recipe}
            </div>` : ''}
            ${c.ingredients ? `<div><strong>Ingredients:</strong> ${c.ingredients}</div>` : ''}
            ${c.glass ? `<div><strong>Glassware:</strong> ${c.glass}</div>` : ''}
            ${c.garnish ? `<div><strong>Garnish:</strong> ${c.garnish}</div>` : ''}
            ${c.missingReason ? `<div class="missing-alert">${c.missingReason}</div>` : ''}
          </div>` : ''}
        </div>
      `).join("");
    }

    document.addEventListener("DOMContentLoaded", loadData);
  </script>
</body>
</html>
