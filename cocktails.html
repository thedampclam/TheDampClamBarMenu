<script>
    let cocktails = [];
    let currentCategory = "All";

    const categoryOrder = [
      "All",
      "Seasonal",
      "House Signatures",
      "Classics",
      "Mule Collection",
      "Mocktails & Zero-Proof"
    ];

    async function init() {
      try {
        const res = await fetch("data/cocktails.json");
        if (!res.ok) throw new Error("Could not fetch cocktails.json");
        const data = await res.json();
        cocktails = data.items || [];
        renderFilters();
        renderGrid();
      } catch (err) {
        console.error("Error loading cocktails:", err);
        document.getElementById("cocktailGrid").innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: var(--neon-red);">
            Failed to load cocktail menu. Please verify data/cocktails.json.
          </div>
        `;
      }
    }

    function renderFilters() {
      const container = document.getElementById("filterContainer");
      container.innerHTML = categoryOrder
        .map(cat => `<button class="filter-btn ${cat === currentCategory ? "active" : ""}" data-category="${cat}">${cat === "Seasonal" ? "🍂 Seasonal" : cat}</button>`)
        .join("");

      container.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentCategory = btn.dataset.category;
          renderFilters();
          renderGrid();
        });
      });
    }

    function renderGrid() {
      const grid = document.getElementById("cocktailGrid");
      
      // Filter list
      let filtered = cocktails.filter(c => currentCategory === "All" || c.category === currentCategory);

      // Sort by defined category priority so "Seasonal" floats to the top when on "All"
      const priorityMap = {
        "Seasonal": 1,
        "House Signatures": 2,
        "Classics": 3,
        "Mule Collection": 4,
        "Mocktails & Zero-Proof": 5
      };

      filtered.sort((a, b) => {
        const pA = priorityMap[a.category] || 99;
        const pB = priorityMap[b.category] || 99;
        return pA - pB;
      });

      document.getElementById("totalCount").innerHTML = `Total Cocktails: <strong>${cocktails.length}</strong>`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--gold-amber);">No cocktails found for this section.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(c => {
        const isSeasonal = c.category === "Seasonal";
        const categoryColor = isSeasonal ? "color: var(--neon-gold); text-shadow: 0 0 6px rgba(255, 215, 0, 0.4);" : "";

        return `
          <div class="card ${!c.inStock ? 'out-of-stock' : ''}">
            <div>
              <div class="card-top">
                <span class="card-category" style="${categoryColor}">${isSeasonal ? "🍂 Seasonal Fall Special" : c.category}</span>
                ${!c.inStock ? `<span class="badge-out">Out of Stock</span>` : ''}
              </div>
              <div class="card-title">${c.name}</div>
              <div class="card-desc">${c.desc || ''}</div>
            </div>

            <div class="card-details">
              ${c.recipe ? `
              <div class="recipe-box">
                <strong>Spec / Recipe:</strong>
                ${c.recipe}
              </div>` : ''}
              ${c.ingredients ? `<div><strong>Ingredients:</strong> ${c.ingredients}</div>` : ''}
              ${c.glass ? `<div><strong>Glassware:</strong> ${c.glass}</div>` : ''}
              ${c.garnish ? `<div><strong>Garnish:</strong> ${c.garnish}</div>` : ''}
              ${c.missingReason ? `<div class="missing-alert">${c.missingReason}</div>` : ''}
            </div>
          </div>
        `;
      }).join("");
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
